# Builds the desktop app for macOS and Windows, checks it starts, and publishes a release.
#   Release: Actions → Desktop app → Run workflow, with the version from package.json (e.g. v1.2.1).
#   Leave the version empty for a test build (downloadable from the run's page for a week).
# After a release, "update-test" installs the previous version on a Mac and a Windows machine,
# lets it update itself to the new one through the real updater, and checks the new one starts.
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish as a release with this version (e.g. v1.2.1). Must match package.json. Empty = test build only.'
        required: false
        default: ''
      notes:
        description: "Optional release notes, separated by ';'. Empty = the changes since the last release."
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            smoke: release/mac-arm64/Ledger.app/Contents/MacOS/Ledger
          - os: windows-latest
            target: --win
            smoke: release/win-unpacked/Ledger.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version matches package.json
        if: env.RELEASE != ''
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE" != "$want" ]; then echo "::error::Release $RELEASE doesn't match package.json ($want). Bump the version first."; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build && npm run desktop:bundle

      - name: Check it starts inside Electron (before packaging)
        run: |
          LEDGER_SMOKE=1 LEDGER_SMOKE_FILE="$PWD/smoke.txt" npx electron . || true
          cat smoke.txt && grep -q "SMOKE OK" smoke.txt

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Check the packaged app starts
        run: |
          LEDGER_SMOKE=1 LEDGER_SMOKE_FILE="$PWD/smoke2.txt" "${{ matrix.smoke }}" || true
          cat smoke2.txt && grep -q "SMOKE OK" smoke2.txt

      # Test builds: downloadable from the run's page for a week. Releases go on the Releases page instead.
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == ''
        with:
          name: ledger-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Release notes
        if: env.RELEASE != ''
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            echo "$NOTES" | tr ';' '\n' | sed -e 's/^ *//' -e '/^$/d' -e 's/^/- /' > notes.md
          else
            prev="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$RELEASE" | head -1)"
            git log --no-merges --pretty='- %s' ${prev:+$prev..}HEAD | grep -v '^- Desktop workflow' > notes.md || true
          fi
          printf '\n\nMac (Apple Silicon): Ledger-%s-mac-arm64.dmg · Mac (Intel): Ledger-%s-mac-x64.dmg · Windows: Ledger-Setup-%s.exe\nAlready have Ledger 1.2 or later? It updates itself: look for "Restart to update".\n' "${RELEASE#v}" "${RELEASE#v}" "${RELEASE#v}" >> notes.md
          cat notes.md

      - name: Attach to the release
        if: env.RELEASE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE }}
          target_commitish: ${{ github.sha }}
          name: Ledger ${{ env.RELEASE }}
          body_path: notes.md
          files: |
            release/*.dmg
            release/*.exe

  update-test:
    needs: build
    if: inputs.release != '' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/update-test.yml
    with:
      release: ${{ inputs.release || github.ref_name }}
